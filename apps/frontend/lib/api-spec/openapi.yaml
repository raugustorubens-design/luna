openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification para Plataforma IA
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Chat and AI conversation operations
  - name: conversations
    description: Conversation management
  - name: gateway
    description: Gateway capability operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to the AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /conversations:
    get:
      operationId: getConversations
      tags: [conversations]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a single conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /conversations/{id}/messages:
    get:
      operationId: getMessages
      tags: [conversations]
      summary: Get messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
  /gateway/capabilities:
    get:
      operationId: getGatewayCapabilities
      tags: [gateway]
      summary: Discover registered gateway capabilities
      responses:
        "200":
          description: Registered capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items:
                      $ref: "#/components/schemas/CapabilityManifest"
                required: [capabilities]
  /gateway/execute:
    post:
      operationId: executeGatewayCapability
      tags: [gateway]
      summary: Execute a gateway capability through the registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityRequest"
      responses:
        "200":
          description: Capability execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityResult"
        "400":
          description: Capability execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityResult"
  /stats:
    get:
      operationId: getStats
      tags: [chat]
      summary: Get platform usage stats
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SendMessageRequest:
      type: object
      properties:
        conversationId:
          type: string
        content:
          type: string
        role:
          type: string
          enum: [user]
      required:
        - content
        - role
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
      required:
        - id
        - title
        - createdAt
        - updatedAt
        - messageCount
    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    PlatformStats:
      type: object
      properties:
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        activeToday:
          type: integer
      required:
        - totalConversations
        - totalMessages
        - activeToday

    CapabilityHealth:
      type: string
      enum: [healthy, degraded, disabled]
    CapabilityManifest:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
        owner:
          type: string
        status:
          $ref: "#/components/schemas/CapabilityHealth"
        requiresApproval:
          type: boolean
        supportsDryRun:
          type: boolean
        supportsRollback:
          type: boolean
        description:
          type: string
      required: [id, version, owner, status, requiresApproval, supportsDryRun, supportsRollback, description]
    CapabilityRequest:
      type: object
      properties:
        capability:
          type: string
        version:
          type: integer
        dryRun:
          type: boolean
        input:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
      required: [capability, input]
    CapabilityEvidence:
      type: object
      properties:
        source:
          type: string
        reference:
          type: string
        observedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
      required: [source, reference, observedAt]
    CapabilityError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
      required: [code, message]
    CapabilityResult:
      type: object
      properties:
        success:
          type: boolean
        capability:
          type: string
        version:
          type: integer
        duration:
          type: integer
        status:
          $ref: "#/components/schemas/CapabilityHealth"
        dryRun:
          type: boolean
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityEvidence"
        output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        error:
          oneOf:
            - $ref: "#/components/schemas/CapabilityError"
            - type: 'null'
      required: [success, capability, version, duration, status, dryRun, evidence, output, error]
